name: Patch sanity checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate patch structure
        run: |
          git apply --numstat patches/dxvk-gaze-vrs.patch
          git apply --numstat patches/wivrn-gaze-export.patch
          test -s patches/dxvk-gaze-vrs.patch
          test -s patches/wivrn-gaze-export.patch
      - name: Install gaze test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libopenxr-dev python3
      - name: Test gaze projection, IPC and OpenXR lifecycle
        run: bash scripts/test-gaze-bridge.sh
