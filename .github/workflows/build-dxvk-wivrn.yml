name: Build DXVK gaze-VRS + OpenXR bridge

on:
  workflow_dispatch:
    inputs:
      dxvk_ref:
        description: 'DXVK base commit/tag (patch target)'
        required: true
        default: 'd30be2ba'
        type: string
      dxvk_repo:
        description: 'DXVK repository URL'
        required: false
        default: 'https://github.com/doitsujin/dxvk.git'
        type: string
      release_tag:
        description: 'Optional: create a GitHub Release with this tag (e.g. v1.0-gaze-vrs)'
        required: false
        default: ''
        type: string
  push:
    tags:
      - 'v*'

jobs:
  dxvk:
    name: Build DXVK (Windows DLLs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install DXVK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build glslang-tools \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

      - name: Clone DXVK
        run: |
          git clone --recursive "${{ inputs.dxvk_repo || 'https://github.com/doitsujin/dxvk.git' }}" dxvk
          git -C dxvk checkout --recurse-submodules "${{ inputs.dxvk_ref || 'd30be2ba' }}"

      - name: Apply DXVK patch
        run: |
          git -C dxvk apply --check "$GITHUB_WORKSPACE/patches/dxvk-gaze-vrs.patch"
          git -C dxvk apply        "$GITHUB_WORKSPACE/patches/dxvk-gaze-vrs.patch"

      - name: Configure
        run: |
          meson setup dxvk/build dxvk \
            --cross-file dxvk/build-win64.txt \
            -Dbuildtype=release \
            -Denable_d3d8=false \
            -Denable_d3d9=false \
            -Denable_d3d10=false

      - name: Build
        run: ninja -C dxvk/build

      - name: Collect DLLs
        run: |
          mkdir -p dist-dxvk
          cp dxvk/build/src/d3d11/d3d11.dll dist-dxvk/
          cp dxvk/build/src/dxgi/dxgi.dll   dist-dxvk/

      - uses: actions/upload-artifact@v4
        with:
          name: dxvk-gaze-vrs
          path: dist-dxvk/

  gaze:
    name: Build and test native OpenXR gaze bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libopenxr-dev pkg-config python3
      - name: Test projection, shared memory and OpenXR lifecycle
        run: bash scripts/test-gaze-bridge.sh
      - name: Build
        run: bash scripts/build-openxr-bridge.sh
      - uses: actions/upload-artifact@v4
        with:
          name: openxr-gaze-bridge-linux-x86_64
          path: dist/gaze/

  release:
    name: Publish release
    needs: [dxvk, gaze]
    if: |
      always()
      && needs.dxvk.result == 'success'
      && needs.gaze.result == 'success'
      && (github.event_name == 'push' || inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Download DXVK artifact
        uses: actions/download-artifact@v4
        with:
          name: dxvk-gaze-vrs
          path: release/dxvk-gaze-vrs

      - name: Download gaze bridge artifact
        uses: actions/download-artifact@v4
        with:
          name: openxr-gaze-bridge-linux-x86_64
          path: release/openxr-gaze-bridge

      - name: Package
        run: |
          cd release
          zip -r dxvk-gaze-vrs.zip dxvk-gaze-vrs
          chmod +x openxr-gaze-bridge/openxr-gaze-bridge
          zip -r openxr-gaze-bridge-linux-x86_64.zip openxr-gaze-bridge
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          body: |
            Experimental gaze-driven VRS build.

            - DXVK base: `${{ inputs.dxvk_ref || 'd30be2ba' }}`
            - Gaze: native Linux OpenXR headless bridge (no WiVRn export patch required)

            See README for install and VRChat launch configuration.
          files: |
            release/dxvk-gaze-vrs.zip
            release/openxr-gaze-bridge-linux-x86_64.zip
          fail_on_unmatched_files: false
